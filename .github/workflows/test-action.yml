name: 'test'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Crowdin Action
        uses: ./
        with:
          command: 'push'
          command_args: '-h'

      - name: Get CLI version
        uses: ./
        with:
          command: 'init'
          command_args: '-V'
