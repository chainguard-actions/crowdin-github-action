name: Test command mode - help output

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: '--help'

      - name: Assert command_output contains help text
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command_output to be non-empty"
            exit 1
          fi
          echo "PASS: command_output is non-empty"

      - name: Assert pull_request_url is empty by default
        env:
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
        run: |
          echo "pull_request_url: '$PR_URL'"
          if [ -n "$PR_URL" ]; then
            echo "FAIL: expected pull_request_url to be empty, got '$PR_URL'"
            exit 1
          fi
          echo "PASS: pull_request_url is empty as expected"

      - name: Assert pull_request_number is empty by default
        env:
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "pull_request_number: '$PR_NUMBER'"
          if [ -n "$PR_NUMBER" ]; then
            echo "FAIL: expected pull_request_number to be empty, got '$PR_NUMBER'"
            exit 1
          fi
          echo "PASS: pull_request_number is empty as expected"
