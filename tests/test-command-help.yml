name: Test command help output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          upload_sources: "false"
          command: "--version"

      - name: Assert command_output contains version text
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command_output to be non-empty (version text)"
            exit 1
          fi
          echo "PASS: command_output contains version text"

      - name: Assert pull_request_url is empty (default)
        env:
          ACTUAL: ${{ steps.action.outputs.pull_request_url }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected pull_request_url to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pull_request_url is empty as expected"

      - name: Assert pull_request_number is empty (default)
        env:
          ACTUAL: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected pull_request_number to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pull_request_number is empty as expected"
