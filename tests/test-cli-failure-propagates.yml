name: Test CLI non-zero exit fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake crowdin CLI on PATH
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/crowdin <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/crowdin-calls.log
          echo "simulated failure" >&2
          exit 3
          EOF
          chmod +x /tmp/fakebin/crowdin
          rm -f /tmp/crowdin-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          use_installed_cli: 'true'
          upload_translations: 'true'
      - name: Assert action failed and stopped after first command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "calls:"; cat /tmp/crowdin-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when CLI exits non-zero"; exit 1
          fi
          if [ "$(wc -l < /tmp/crowdin-calls.log)" -ne 1 ]; then
            echo "FAIL: action should stop after the failing upload sources"; exit 1
          fi
          if ! grep -q "^upload sources" /tmp/crowdin-calls.log; then
            echo "FAIL: first call should be upload sources"; exit 1
          fi
          echo "PASS"
