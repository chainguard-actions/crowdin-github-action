name: Test action with config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create crowdin config file
        run: |
          cat > crowdin.yml <<'EOF'
          project_id: "999999"
          api_token: "invalid-token-for-testing"
          base_path: "."
          base_url: "https://api.crowdin.com"
          files:
            - source: /src/**/*.json
              translation: /translations/%two_letters_code%/%original_file_name%
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'false'
          download_translations: 'false'
          config: 'crowdin.yml'

      - name: Assert action ran (with config file)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials in config"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
