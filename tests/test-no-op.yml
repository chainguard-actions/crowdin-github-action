name: Test no-op (all operations disabled)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
        continue-on-error: true

      - name: Assert action ran without error when all operations are disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          CMD_OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: '$PR_CREATED'"
          echo "pull_request_url: '$PR_URL'"
          echo "command_output: '$CMD_OUTPUT'"
          if [ "$OUTCOME" = "success" ]; then
            # When no operations are performed, pull_request_created should be false
            if [ "$PR_CREATED" != "false" ]; then
              echo "FAIL: expected pull_request_created='false', got '$PR_CREATED'"
              exit 1
            fi
            # pull_request_url should be empty
            if [ -n "$PR_URL" ]; then
              echo "FAIL: expected pull_request_url to be empty, got '$PR_URL'"
              exit 1
            fi
            echo "PASS: no-op action succeeded with correct default outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or environment issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
