name: Test no-op run (all operations disabled)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'

      - name: Assert action succeeded with no operations
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          CMD_OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "pull_request_created: '$PR_CREATED'"
          echo "command_output: '$CMD_OUTPUT'"
          # When no operations are requested, the action should succeed
          # pull_request_created should be 'false' (the default)
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created='false', got '$PR_CREATED'"
            exit 1
          fi
          echo "PASS: action completed with no operations, pull_request_created=false"
