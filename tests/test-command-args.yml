name: Test command with command_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'false'
          command: 'help'
          command_args: 'upload'

      - name: Assert command ran with command_args
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.command_output }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command_output: $RESULT"
          echo "pull_request_created: $PR_CREATED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: command succeeded but command_output is empty"
              exit 1
            fi
            if [ "$PR_CREATED" != "false" ]; then
              echo "FAIL: expected pull_request_created=false"
              exit 1
            fi
            echo "PASS: command_output captured"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$PR_CREATED" != "false" ]; then
              echo "FAIL: default output pull_request_created should be 'false' even on failure"
              exit 1
            fi
            echo "PASS: CLI rejected the command args gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
