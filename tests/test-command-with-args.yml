name: Test command with command_args (upload --help)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: 'upload'
          command_args: '--help'
      - name: Assert command_output contains upload help text
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
        run: |
          echo "command_output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: command_output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi 'upload'; then
            echo "FAIL: expected help output mentioning 'upload'"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qi 'sources'; then
            echo "FAIL: expected help output mentioning 'sources' subcommand"
            exit 1
          fi
          echo "PASS"
