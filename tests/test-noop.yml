name: Test all operations disabled (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
      - name: Assert default outputs
        env:
          CREATED: ${{ steps.action.outputs.pull_request_created }}
          URL: ${{ steps.action.outputs.pull_request_url }}
          NUM: ${{ steps.action.outputs.pull_request_number }}
          CMD: ${{ steps.action.outputs.command_output }}
        run: |
          echo "created='$CREATED' url='$URL' number='$NUM' cmd='$CMD'"
          if [ "$CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created=false"
            exit 1
          fi
          if [ -n "$URL" ] || [ -n "$NUM" ] || [ -n "$CMD" ]; then
            echo "FAIL: expected empty url/number/command_output"
            exit 1
          fi
          echo "PASS"
