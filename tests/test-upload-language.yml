name: Test upload language option

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'true'
          upload_language: 'de'
          download_sources: 'false'
          download_translations: 'false'
          project_id: '1'
          token: 'test-token-placeholder'

      - name: Assert action ran (upload_language input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with invalid Crowdin token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
