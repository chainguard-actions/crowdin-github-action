name: Test installing real Crowdin CLI from npm
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli_version: '5.5.0'
          command: '--version'
      - name: Assert installed CLI version
        env:
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "command_output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "5.5.0"; then
            echo "FAIL: expected version 5.5.0 in output"; exit 1
          fi
          echo "PASS"
