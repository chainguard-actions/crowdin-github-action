name: Test dryrun action mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'false'
          download_translations: 'false'
          dryrun_action: 'true'
          project_id: '999999'
          token: 'invalid-token-for-testing'

      - name: Assert action ran (dryrun mode, no valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: $PR_CREATED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials in dryrun mode"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dryrun mode"
            # In dryrun mode with no real changes, pull_request_created should be false
            if [ "$PR_CREATED" = "true" ]; then
              echo "FAIL: pull_request_created should not be true in dryrun mode with no changes"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
