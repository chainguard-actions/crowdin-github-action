name: Test download translations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'true'
          download_language: 'fr'
          push_translations: 'false'
          create_pull_request: 'false'
          pull_request_title: 'Test PR Title'
          pull_request_body: 'Test PR body content'
          pull_request_assignees: 'user1,user2'
          pull_request_reviewers: 'reviewer1,reviewer2'
          pull_request_team_reviewers: 'team-slug'
          pull_request_labels: 'translations,l10n'
          pull_request_base_branch_name: 'main'
          localization_branch_name: 'l10n_test_branch'
          dryrun_action: 'true'
          project_id: '123456'
          token: 'fake-token-for-dryrun'
          source: '**/*.pot'
          translation: '**/%two_letters_code%/**/*.po'
      - name: Assert dryrun completed
        run: |
          echo "Action completed in dryrun mode for download translations"
          echo "PASS"
