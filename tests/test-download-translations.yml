name: Test download translations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'true'
          download_language: 'fr'
          crowdin_branch_name: 'main'
          push_translations: 'false'
          create_pull_request: 'false'
          pull_request_body: 'Automated translations update'
          pull_request_assignees: 'octocat'
          pull_request_reviewers: 'octocat'
          pull_request_team_reviewers: 'my-team'
          pull_request_labels: 'translations,automated'
          pull_request_base_branch_name: 'main'
          project_id: '123456'
          token: 'fake-token-for-testing'
          source: '/src/**'
          translation: '/translations/%two_letters_code%/%original_file_name%'
          dryrun_action: 'true'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "PASS: inputs were accepted"
