name: Test PR and GPG options are ignored when push is disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake crowdin CLI on PATH
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/crowdin <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/crowdin-calls.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/crowdin
          rm -f /tmp/crowdin-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
          git rev-parse HEAD > /tmp/head-before
      - id: action
        uses: .
        with:
          use_installed_cli: 'true'
          upload_sources: 'false'
          download_translations: 'true'
          push_translations: 'false'
          create_pull_request: 'true'
          pull_request_body: 'Body text'
          pull_request_assignees: 'user1,user2'
          pull_request_reviewers: 'rev1'
          pull_request_team_reviewers: 'team-a'
          pull_request_labels: 'l10n,automated'
          pull_request_base_branch_name: 'main'
          github_api_base_url: 'api.github.com'
          gpg_private_key: 'not-a-real-key'
      - name: Assert download ran, nothing pushed, no PR
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "calls:"; cat /tmp/crowdin-calls.log
          echo "created=$PR_CREATED url=$PR_URL number=$PR_NUMBER"
          if [ "$(wc -l < /tmp/crowdin-calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly one CLI invocation"; exit 1
          fi
          case "$(cat /tmp/crowdin-calls.log)" in
            download*) ;;
            *) echo "FAIL: expected download command"; exit 1 ;;
          esac
          if [ "$PR_CREATED" != "false" ] || [ -n "$PR_URL" ] || [ -n "$PR_NUMBER" ]; then
            echo "FAIL: no pull request should be created"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(cat /tmp/head-before)" ]; then
            echo "FAIL: HEAD changed although push was disabled"; exit 1
          fi
          echo "PASS"
