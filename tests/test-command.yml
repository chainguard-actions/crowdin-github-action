name: Test command input (crowdin version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'false'
          command: '--version'

      - name: Assert command_output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
        run: |
          echo "command_output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected command_output to be non-empty"
            exit 1
          fi
          echo "PASS: command_output is non-empty"

      - name: Assert pull_request_created is false
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "pull_request_created: $PR_CREATED"
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created to be 'false', got '$PR_CREATED'"
            exit 1
          fi
          echo "PASS: pull_request_created is false"
