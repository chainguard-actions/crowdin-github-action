name: Test upload sources with language, source, translation, and base_path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'true'
          download_translations: 'false'
          upload_language: 'fr'
          source: 'src/**/*.json'
          translation: 'translations/%two_letters_code%/%original_file_name%'
          base_path: '.'
          project_id: '999999'
          token: 'invalid-token-for-testing'

      - name: Assert action ran (upload with language, source, translation, base_path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
