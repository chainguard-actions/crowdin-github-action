name: Test upload sources
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'true'
          upload_translations: 'false'
          download_translations: 'false'
          dryrun_action: 'true'
          project_id: '123456'
          token: 'fake-token-for-dryrun'
          base_url: 'https://api.crowdin.com'
          base_path: '.'
          source: '**/*.pot'
          translation: '**/%two_letters_code%/**/*.po'
          crowdin_branch_name: 'main'
          config: 'actions/hardened/crowdin--github-action/v2.16.3/tests/fixtures/crowdin.yml'
      - name: Assert dryrun completed
        run: |
          echo "Action completed in dryrun mode"
          echo "PASS"
