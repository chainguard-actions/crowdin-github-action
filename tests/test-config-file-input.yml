name: Test config file path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create crowdin config file
        run: |
          cat > "$GITHUB_WORKSPACE/crowdin-test.yml" <<'EOF'
          project_id: "999999"
          api_token: "fake-crowdin-token-for-test"
          base_url: "https://api.crowdin.com"
          base_path: "."
          files:
            - source: "**/*.yml"
              translation: "/translations/%two_letters_code%/%original_file_name%"
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          dryrun_action: 'true'
          config: 'crowdin-test.yml'

      - name: Assert action ran with config file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with invalid Crowdin credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
