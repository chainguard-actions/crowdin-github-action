name: Test custom command with installed (fake) CLI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake crowdin CLI on PATH
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/crowdin <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/crowdin-calls.log
          echo "fake-crowdin-output line1"
          echo "args: $*"
          exit 0
          EOF
          chmod +x /tmp/fakebin/crowdin
          rm -f /tmp/crowdin-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          use_installed_cli: 'true'
          command: 'string list'
          command_args: '--verbose --croql "lang = \"uk\""'
      - name: Assert command output and arguments
        env:
          OUTPUT: ${{ steps.action.outputs.command_output }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "command_output: $OUTPUT"
          echo "calls:"; cat /tmp/crowdin-calls.log
          if ! echo "$OUTPUT" | grep -q "fake-crowdin-output line1"; then
            echo "FAIL: command_output missing fake CLI output"; exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "args: string list --verbose --croql lang = \"uk\""; then
            echo "FAIL: command_output does not reflect expected args"; exit 1
          fi
          if [ "$(wc -l < /tmp/crowdin-calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly one CLI invocation (command mode skips upload)"; exit 1
          fi
          if grep -q "upload" /tmp/crowdin-calls.log; then
            echo "FAIL: upload should not run in command mode"; exit 1
          fi
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: pull_request_created should be 'false', got '$PR_CREATED'"; exit 1
          fi
          echo "PASS"
