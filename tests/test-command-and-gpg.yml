name: Test command and GPG inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          command: 'list projects'
          command_args: '--plain'
          token: 'fake-token-for-testing'
          project_id: '12345'
          base_url: 'https://api.crowdin.com'
          github_api_base_url: 'https://api.github.com'
          gpg_private_key: 'fake-gpg-key-for-testing'
          gpg_passphrase: 'fake-passphrase'
          dryrun_action: 'false'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: command, command_args, github_api_base_url, and gpg_private_key inputs were accepted"
