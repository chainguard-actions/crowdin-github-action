name: Test config options parsed alongside command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: '--version'
          project_id: '123456'
          token: 'dummy-crowdin-token'
          base_url: 'https://api.crowdin.com'
          base_path: '.'
          source: 'locales/en/*.json'
          translation: 'locales/%two_letters_code%/%original_file_name%'
          crowdin_branch_name: 'test-branch'
          upload_language: 'uk'
          download_language: 'de'
      - name: Assert command_output contains CLI version and no PR created
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
        run: |
          echo "command_output: $ACTUAL"
          echo "pull_request_created: $PR_CREATED"
          echo "pull_request_url: $PR_URL"
          if ! echo "$ACTUAL" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a semantic version in command_output"
            exit 1
          fi
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created=false"
            exit 1
          fi
          if [ -n "$PR_URL" ]; then
            echo "FAIL: expected empty pull_request_url"
            exit 1
          fi
          echo "PASS"
