name: Test download translations fails gracefully without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'true'
          push_translations: 'false'
          project_id: '999999'
          token: 'invalid-token-for-testing'

      - name: Assert action failed gracefully (no valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: $PR_CREATED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # pull_request_created should not be true since push_translations is false
          if [ "$PR_CREATED" = "true" ]; then
            echo "FAIL: pull_request_created should not be true when push_translations is false"
            exit 1
          fi
          echo "PASS: pull_request_created is not true as expected"
