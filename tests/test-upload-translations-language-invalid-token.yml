name: Test upload translations for one language with invalid Crowdin token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'true'
          upload_language: 'uk'
          project_id: '1'
          token: 'invalid-crowdin-token'
          source: 'nonexistent/**/*.json'
          translation: 'nonexistent/%two_letters_code%/%original_file_name%'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: '$PR_CREATED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid Crowdin credentials"
            exit 1
          fi
          if [ "$PR_CREATED" = "true" ]; then
            echo "FAIL: no PR should be created"
            exit 1
          fi
          echo "PASS"
