name: Test upload sources fails without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no crowdin config in workspace root
        run: |
          rm -f crowdin.yml crowdin.yaml
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          source: 'tests/*.yml'
          translation: '/%two_letters_code%/%original_file_name%'
      - name: Assert action failed due to missing project id / token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: $PR_CREATED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without Crowdin credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
