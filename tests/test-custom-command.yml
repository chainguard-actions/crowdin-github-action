name: Test custom command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'false'
          command: 'crowdin'
          command_args: '--version'
          config: 'crowdin.yml'
          github_api_base_url: 'https://api.github.com'
          gpg_private_key: 'fake-gpg-key'
          gpg_passphrase: 'fake-passphrase'
          project_id: '123456'
          token: 'fake-token-for-testing'
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "PASS: inputs were accepted"
