name: Test pull request options without download (no PR created)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          github_api_base_url: 'api.github.com'
          gpg_private_key: 'dummy-key-not-used-when-nothing-is-pushed'
          pull_request_body: 'Test body'
          pull_request_assignees: 'user-a,user-b'
          pull_request_reviewers: 'reviewer-a'
          pull_request_team_reviewers: 'team-a'
          pull_request_labels: 'i18n, crowdin'
          pull_request_base_branch_name: 'main'
      - name: Assert no pull request was created
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "pull_request_created: '$PR_CREATED'"
          echo "pull_request_url: '$PR_URL'"
          echo "pull_request_number: '$PR_NUMBER'"
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created=false"
            exit 1
          fi
          if [ -n "$PR_URL" ] || [ -n "$PR_NUMBER" ]; then
            echo "FAIL: expected empty url/number"
            exit 1
          fi
          echo "PASS"
      - name: Assert no private.key left behind and tree untouched
        run: |
          if [ -f "$GITHUB_WORKSPACE/private.key" ]; then
            echo "FAIL: private.key written to workspace"
            exit 1
          fi
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: action modified the workspace"
            exit 1
          fi
          echo "PASS"
