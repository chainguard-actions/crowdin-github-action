name: Test config options with all operations disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          config: 'crowdin-test.yml'
          project_id: '123456'
          token: 'not-a-real-crowdin-token'
          base_url: 'https://api.crowdin.com'
          base_path: '.'
          crowdin_branch_name: 'test-branch'
      - name: Assert default outputs
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
          CMD_OUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "pull_request_created: '$PR_CREATED'"
          echo "pull_request_url: '$PR_URL'"
          echo "pull_request_number: '$PR_NUMBER'"
          echo "command_output: '$CMD_OUT'"
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: expected pull_request_created=false"
            exit 1
          fi
          if [ -n "$PR_URL" ] || [ -n "$PR_NUMBER" ] || [ -n "$CMD_OUT" ]; then
            echo "FAIL: expected empty url/number/command_output"
            exit 1
          fi
          echo "PASS"
      - name: Assert working tree untouched
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: action modified the workspace"
            exit 1
          fi
          echo "PASS"
