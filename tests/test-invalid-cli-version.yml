name: Test failure for unknown CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cli_version: '0.0.0-does-not-exist'
          command: '--version'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unknown CLI version"; exit 1
          fi
          if [ -n "$OUTPUT" ]; then
            echo "FAIL: command_output should be empty"; exit 1
          fi
          echo "PASS"
