name: Test failure when installed CLI is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no crowdin on PATH
        run: |
          if command -v crowdin; then
            echo "crowdin unexpectedly present on PATH"; exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          use_installed_cli: 'true'
          command: '--version'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when crowdin is not on PATH"; exit 1
          fi
          echo "PASS"
