name: Test default outputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'

      - name: Assert pull_request_url is empty
        env:
          ACTUAL: ${{ steps.action.outputs.pull_request_url }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected pull_request_url to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pull_request_url is empty as expected"

      - name: Assert pull_request_number is empty
        env:
          ACTUAL: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected pull_request_number to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pull_request_number is empty as expected"

      - name: Assert pull_request_created is false
        env:
          ACTUAL: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected pull_request_created to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: pull_request_created is false as expected"

      - name: Assert command_output is empty when no command given
        env:
          ACTUAL: ${{ steps.action.outputs.command_output }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected command_output to be empty when no command given, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: command_output is empty as expected"
