name: Test default outputs initialization
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'false'

      - name: Assert pull_request_url is empty by default
        env:
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "pull_request_url: '$PR_URL'"
          if [ -n "$PR_URL" ]; then
            echo "FAIL: expected pull_request_url to be empty by default, got '$PR_URL'"
            exit 1
          fi
          echo "PASS: pull_request_url is empty as expected"

      - name: Assert pull_request_number is empty by default
        env:
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
        run: |
          echo "pull_request_number: '$PR_NUMBER'"
          if [ -n "$PR_NUMBER" ]; then
            echo "FAIL: expected pull_request_number to be empty by default, got '$PR_NUMBER'"
            exit 1
          fi
          echo "PASS: pull_request_number is empty as expected"

      - name: Assert pull_request_created is false by default
        env:
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "pull_request_created: '$PR_CREATED'"
          if [ "$PR_CREATED" = "true" ]; then
            echo "FAIL: expected pull_request_created to not be 'true', got '$PR_CREATED'"
            exit 1
          fi
          echo "PASS: pull_request_created is not 'true' (got '$PR_CREATED')"
