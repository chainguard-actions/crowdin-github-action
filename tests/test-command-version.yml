name: Test command input - version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: '--version'

      - name: Assert action ran and produced version output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command_output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT" ]; then
              echo "FAIL: action succeeded but command_output is empty"
              exit 1
            fi
            echo "PASS: command_output is set with version info"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (crowdin --version may exit non-zero, which is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
