name: Test command input - crowdin version

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: '--version'

      - name: Assert command_output contains version info
        env:
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "command_output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: command_output is empty"
            exit 1
          fi
          # crowdin --version should output something like "crowdin 5.x.x" or similar
          if echo "$OUTPUT" | grep -qiE 'crowdin|version|[0-9]+\.[0-9]+'; then
            echo "PASS: command_output contains version info"
          else
            echo "FAIL: command_output does not look like version output: $OUTPUT"
            exit 1
          fi
