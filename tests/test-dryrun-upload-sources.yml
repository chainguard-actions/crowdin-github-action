name: Test dryrun mode with upload sources

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          dryrun_action: 'true'
          project_id: '1'
          token: 'dryrun-test-token'

      - name: Assert action ran (dryrun with invalid token fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: '$PR_CREATED'"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dryrun mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with invalid Crowdin token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
