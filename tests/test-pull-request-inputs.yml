name: Test pull request inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_translations: 'false'
          create_pull_request: 'true'
          pull_request_title: 'Test PR Title'
          pull_request_body: 'Test PR body content'
          pull_request_assignees: 'user1,user2'
          pull_request_reviewers: 'reviewer1,reviewer2'
          pull_request_team_reviewers: 'team1'
          pull_request_labels: 'l10n,translations'
          pull_request_base_branch_name: 'main'
          project_id: '0'
          token: fake-token-for-coverage
      - name: Assert action ran with pull request inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
          PR_NUMBER: ${{ steps.action.outputs.pull_request_number }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_url: $PR_URL"
          echo "pr_number: $PR_NUMBER"
          echo "pr_created: $PR_CREATED"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with pull request inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
