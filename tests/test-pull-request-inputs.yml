name: Test pull request inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: help
          pull_request_body: 'This PR contains new Crowdin translations.'
          pull_request_assignees: 'octocat'
          pull_request_reviewers: 'octocat'
          pull_request_team_reviewers: 'my-team'
          pull_request_labels: 'translations,l10n'
          pull_request_base_branch_name: main
      - name: Assert action ran with pull request inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with pull request inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
