name: Test pull request inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: "--version"
          pull_request_assignees: "user1,user2"
          pull_request_base_branch_name: "main"
          pull_request_body: "Automated translations update"
          pull_request_labels: "translations,l10n"
          pull_request_reviewers: "reviewer1,reviewer2"
          pull_request_team_reviewers: "team-l10n"
          upload_sources: "false"
          upload_translations: "false"
          download_sources: "false"
          download_translations: "false"
        continue-on-error: true
      - name: Assert action ran (version command or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
