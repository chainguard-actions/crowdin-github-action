name: Test upload with config options (dryrun, fake Crowdin credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create crowdin config and source files inside the workspace
        run: |
          mkdir -p .crowdin-test/src/en
          cat > .crowdin-test/crowdin.yml <<'EOF'
          files:
            - source: /src/en/*.json
              translation: /src/%two_letters_code%/%original_file_name%
          EOF
          echo '{"hello": "Hello"}' > .crowdin-test/src/en/messages.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'true'
          upload_translations: 'true'
          upload_language: 'uk'
          download_translations: 'false'
          dryrun_action: 'true'
          config: '.crowdin-test/crowdin.yml'
          base_path: '.crowdin-test'
          base_url: 'https://api.crowdin.com'
          source: 'src/en/*.json'
          translation: 'src/%two_letters_code%/%original_file_name%'
          crowdin_branch_name: 'act-test-branch'
          project_id: '999999'
          token: 'fake-crowdin-token-for-config-test'

      - name: Assert action ran (fails gracefully with fake Crowdin credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_CREATED: ${{ steps.action.outputs.pull_request_created }}
          PR_URL: ${{ steps.action.outputs.pull_request_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull_request_created: $PR_CREATED"
          echo "pull_request_url: $PR_URL"
          if [ "$PR_CREATED" != "false" ]; then
            echo "FAIL: upload-only run must not create a PR (got '$PR_CREATED')"
            exit 1
          fi
          if [ -n "$PR_URL" ]; then
            echo "FAIL: pull_request_url should be empty for upload-only run"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: dryrun upload succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake Crowdin credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
