name: Test config-related inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          command: 'help'
          project_id: '12345'
          token: 'fake-crowdin-token-for-testing'
          base_url: 'https://crowdin.com'
          base_path: 'src'
          source: '/**/*.json'
          translation: '/translations/%two_letters_code%/**/%original_file_name%'
          config: 'crowdin.yml'

      - name: Assert action ran with config inputs
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with config inputs, outcome=$OUTCOME"
