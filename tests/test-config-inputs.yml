name: Test config inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: "--version"
          project_id: "12345"
          token: "fake-crowdin-token"
          base_url: "https://crowdin.com"
          base_path: "."
          source: "/src/**"
          translation: "/translations/%two_letters_code%/**"
          config: "crowdin.yml"
          upload_sources: "false"
          upload_translations: "false"
          download_sources: "false"
          download_translations: "false"
        continue-on-error: true
      - name: Assert action ran (version command or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
