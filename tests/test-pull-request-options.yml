name: Test pull request configuration inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: '--version'
          pull_request_assignees: 'user1,user2'
          pull_request_base_branch_name: 'main'
          pull_request_body: 'Automated translations update'
          pull_request_labels: 'translations,l10n'
          pull_request_reviewers: 'reviewer1,reviewer2'
          pull_request_team_reviewers: 'team-l10n'

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT: ${{ steps.action.outputs.command_output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "command_output: $OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT" ]; then
              echo "FAIL: action succeeded but command_output is empty"
              exit 1
            fi
            echo "PASS: command_output is set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (failed gracefully, likely missing credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
