name: Test pull request options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload_sources: 'false'
          upload_translations: 'false'
          download_sources: 'false'
          download_translations: 'false'
          command: 'help'
          pull_request_body: 'This PR contains new Crowdin translations.'
          pull_request_assignees: 'octocat'
          pull_request_reviewers: 'octocat'
          pull_request_team_reviewers: 'my-team'
          pull_request_labels: 'translations,l10n'
          pull_request_base_branch_name: 'main'

      - name: Assert action ran with pull request options
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with pull request options, outcome=$OUTCOME"
