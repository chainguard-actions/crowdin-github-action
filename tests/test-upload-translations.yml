name: Test upload translations only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake crowdin CLI on PATH
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/crowdin <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/crowdin-calls.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/crowdin
          rm -f /tmp/crowdin-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          use_installed_cli: 'true'
          upload_sources: 'false'
          upload_translations: 'true'
          upload_language: 'uk'
          auto_approve_imported: 'true'
          import_eq_suggestions: 'true'
          upload_translations_args: '--translate-hidden'
      - name: Assert CLI invoked for translations only
        run: |
          echo "calls:"; cat /tmp/crowdin-calls.log
          if [ "$(wc -l < /tmp/crowdin-calls.log)" -ne 1 ]; then
            echo "FAIL: expected exactly one CLI invocation"; exit 1
          fi
          LINE="$(cat /tmp/crowdin-calls.log)"
          case "$LINE" in
            "upload translations --no-progress --no-colors"*) ;;
            *) echo "FAIL: expected 'upload translations' command"; exit 1 ;;
          esac
          for expected in "--language=uk" "--auto-approve-imported" "--import-eq-suggestions" "--translate-hidden"; do
            if ! echo "$LINE" | grep -qF -- "$expected"; then
              echo "FAIL: missing arg $expected"; exit 1
            fi
          done
          if grep -q "upload sources" /tmp/crowdin-calls.log; then
            echo "FAIL: upload sources should be disabled"; exit 1
          fi
          echo "PASS"
