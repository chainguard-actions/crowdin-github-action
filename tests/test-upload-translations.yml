name: Test upload translations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upload_sources: 'false'
          upload_translations: 'true'
          upload_language: 'fr'
          auto_approve_imported: 'false'
          import_eq_suggestions: 'false'
          upload_translations_args: '--no-progress'
          download_translations: 'false'
          dryrun_action: 'true'
          project_id: '123456'
          token: 'fake-token-for-dryrun'
          source: '**/*.pot'
          translation: '**/%two_letters_code%/**/*.po'
      - name: Assert dryrun completed
        run: |
          echo "Action completed in dryrun mode for upload translations"
          echo "PASS"
